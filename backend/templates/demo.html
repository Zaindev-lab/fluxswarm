<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>Try FluxSwarm Free</title>
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('/static/fonts/Inter-400.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('/static/fonts/Inter-600.woff2') format('woff2')}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:swap;src:url('/static/fonts/SpaceGrotesk-500.woff2') format('woff2')}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;font-display:swap;src:url('/static/fonts/SpaceGrotesk-700.woff2') format('woff2')}
  :root{--bg:#0b0f1a;--card:#141a2c;--acc:#22d3ee;--acc2:#7c3aed;--ok:#10b981;--warn:#f1c40f;--txt:#eef1fb;--mut:#8b96b3;--bord:#25304a;--fieldbg:#0f1424;--fieldbord:#25304a;--dash:#25304a;--err:#f87171;--btnbg:#22d3ee}
  html[data-theme="light"]{--bg:#f5f7fb;--card:#ffffff;--acc:#2563eb;--acc2:#7c3aed;--ok:#16a34a;--warn:#b45309;--txt:#1a2233;--mut:#4a5568;--bord:#d7dcea;--fieldbg:#f0f3f9;--fieldbord:#c9d2e6;--dash:#dbe1ee;--err:#dc2626;--btnbg:#2563eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt)}
  main{max-width:720px;margin:0 auto;padding:32px 16px}
  h1{font-family:'Space Grotesk','Inter',sans-serif;font-size:26px;margin:0 0 6px;letter-spacing:-.4px}
  .sub{color:var(--mut);margin:0 0 24px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .tools{display:flex;gap:8px}
  .tools button{background:var(--card);color:var(--txt);border:1px solid var(--bord);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;margin:0}
  .card{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:20px}
  textarea{width:100%;min-height:96px;background:var(--fieldbg);color:var(--txt);border:1px solid var(--fieldbord);border-radius:8px;padding:12px;font-size:15px}
  button{margin-top:12px;background:linear-gradient(92deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:8px;padding:12px 22px;font-size:16px;cursor:pointer;font-weight:700;box-shadow:0 6px 18px rgba(34,211,238,.22)}
  button:disabled{opacity:.5;cursor:wait}
  .q{color:var(--mut);font-size:13px;margin-top:10px}
  .agent{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--dash)}
  .agent:last-child{border-bottom:0}
  .bar{flex:1;height:8px;background:var(--fieldbg);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .5s}
  .st{width:74px;font-size:12px;color:var(--mut)}
  .eta{color:var(--mut);font-size:13px;margin-top:12px}
  #err{color:var(--err);font-size:14px;margin-top:12px}
  .link{display:inline-block;margin-top:18px;color:var(--acc);text-decoration:none}
  .skel{flex:1;height:8px;background:var(--fieldbg);border-radius:6px;position:relative;overflow:hidden}
  .skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--bord),transparent);animation:sh 1.2s infinite}
  @keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .retry-btn{display:inline-block;margin-top:8px;background:var(--err);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-size:14px;cursor:pointer}
  @media(max-width:480px){body{font-size:14px}main{padding:20px 12px}h1{font-size:22px}textarea{font-size:14px}button{font-size:15px;padding:10px 18px}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>⚡ Try FluxSwarm Free</h1>
    <div class="tools">
      <img class="nav-logo" src="/static/brand/logo.jpg" alt="" width="26" height="26" style="border-radius:7px;object-fit:cover" />
      <button id="themeBtn" data-onclick="toggleTheme" title="Toggle theme" aria-label="Toggle theme">🌙</button>
    </div>
  </div>
  <p class="sub">A swarm of AI agents builds your project in real-time.</p>
  <div class="card">
    <label for="goal">Describe your project</label>
    <textarea id="goal" placeholder="e.g. Build a FastAPI app with auth and tests"></textarea>
    <button id="launch" data-onclick="launchDemo">Launch Free Trial</button>
    <p class="q" id="quota" aria-live="polite"></p>
    <div id="stage" hidden>
      <hr style="border:0;border-top:1px dashed var(--dash);margin:16px 0">
      <div id="agents" aria-live="polite"></div>
      <p class="eta" id="eta"></p>
    </div>
    <div id="err" hidden></div>
  </div>
  <a class="link" href="/">→ Full account: 5 free credits & paid credit packs</a>
</main>
<script nonce="{{ csp_nonce }}">
const $=id=>document.getElementById(id);
let slug=null;

// Click delegate for CSP-compliant event handling.
document.addEventListener("click",e=>{
  const btn=e.target.closest("[data-onclick]");
  if(!btn)return;
  const action=btn.dataset.onclick;
  if(action==="toggleTheme"){
    const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
    document.documentElement.dataset.theme=next;
    localStorage.setItem("fsTheme",next);
    $("themeBtn").textContent=next==="dark"?"🌙":"☀️";
  }
  if(action==="launchDemo")launchDemo();
});

// Theme (dark default, respect system, persist choice).
(function(){
  const saved=localStorage.getItem("fsTheme");
  const theme=saved||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  document.documentElement.dataset.theme=theme;
  $("themeBtn").textContent=theme==="dark"?"🌙":"☀️";
})();

async function quota(){try{
  const r=await fetch("/api/demo/status");const d=await r.json();
  $("quota").textContent="Remaining daily quota: "+d.daily_quota_remaining+" of "+d.daily_quota_total+" launches.";
}catch(e){}}
quota();

const TOAST_STATUS={done:"Build complete!",running:"Swarm building…",pending:"Board preparing…",blocked:"Build paused",stalled:"Build stalled",failed:"Build failed"};
const SKEL="<div class='agent'><span style='color:var(--mut)'>••••</span><div class='skel'></div><span class='st'>…</span></div>";
let firstPoll=true;
let lastAction=null;

function showError(msg){
  $("err").hidden=false;
  $("err").innerHTML=msg+' <button class="retry-btn" id="retryBtn">Try again</button>';
  $("retryBtn").onclick=()=>{lastAction&&lastAction();};
}

async function poll(){
  if(!slug)return;
  try{
    const r=await fetch("/api/demo/progress/"+encodeURIComponent(slug));
    if(!r.ok){if(r.status===404){showError("Board not ready yet — try launching again.");}return;}
    const d=await r.json();
    $("agents").innerHTML=d.agents.map(a=>
      '<div class="agent"><span>'+a.name+'</span>'+
      '<div class="bar"><i style="width:0%" data-w="'+a.progress+'"></i></div>'+
      '<span class="st">'+(TOAST_STATUS[a.status]||a.status)+'</span></div>'
    ).join("");
    document.querySelectorAll(".bar i[data-w]").forEach(el=>{el.style.width=el.getAttribute("data-w")+"%";el.removeAttribute("data-w");});
    if(d.status==="running"){
      $("eta").textContent="Estimated time remaining: ~"+Math.max(0,d.estimated_remaining_seconds||0)+" seconds";
      setTimeout(poll,4000);
    }else{
      $("eta").textContent="✅ Trial session complete. Sign up free to get 5 credits and launch more projects.";
      setTimeout(poll,10000);
    }
  }catch(e){setTimeout(poll,4000);}
}

async function launchDemo(){
  const goal=($("goal").value||"Build a sample FastAPI notes API with tests and CI/CD (DEMO)").trim();
  $("launch").disabled=true;$("err").hidden=true;
  lastAction=launchDemo;
  async function recoverSlug(){
    const r=await fetch("/api/demo/latest");
    const d=await r.json();
    if(d&&d.board)return d.board;
    return null;
  }
  try{
    const r=await fetch("/api/demo/launch?goal="+encodeURIComponent(goal));
    if(!r.ok){
      const t=await r.text();let msg=t;
      try{
        const j=JSON.parse(t);
        msg=(j.message&&(j.message.en||j.message.ar))||(j.detail&&(j.detail.en||j.detail.ar))||j.detail||j.error;
        if(typeof msg!=="string")msg=JSON.stringify(msg);
        if(j&&j.retry_after_seconds){msg+=" ("+Math.ceil(j.retry_after_seconds/60)+" minutes)";}
      }catch(e){}
      showError("Launch failed: "+msg);
      return;
    }
    const d=await r.json();slug=d.slug;$("stage").hidden=false;
    $("agents").innerHTML=SKEL.repeat(6);$("eta").textContent="Preparing swarm...";
    poll();
  }catch(e){
    // A timeout at the edge can drop the launch body AFTER the board exists;
    // recover the board via the latest-session endpoint before surfacing error.
    try{
      const s=await recoverSlug();
      if(s){slug=s;$("stage").hidden=false;$("agents").innerHTML=SKEL.repeat(6);poll();return;}
    }catch(_){}
    showError("Connection error — please try again.");
  }finally{$("launch").disabled=false;}
}

// Resume an in-flight swarm across page reloads / dropped responses.
async function resume(){
  try{
    const s=await (async()=>{const r=await fetch("/api/demo/latest");const d=await r.json();return d&&d.board?d.board:null;})();
    if(s){slug=s;$("stage").hidden=false;$("agents").innerHTML=SKEL.repeat(6);poll();}
  }catch(e){}
}
resume();
</script>
</body>
</html>
