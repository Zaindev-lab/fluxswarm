# Nginx reverse proxy with TLS for FluxSwarm.
#
# Unlike Caddy, Nginx does NOT auto-provision certificates. Obtain certs first
# (e.g. `certbot --nginx -d app.fluxswarm.ai`) or mount your own fullchain.pem
# + privkey.pem and point ssl_certificate / ssl_certificate_key at them.
#
# This proxy MUST be listed in FLUXSWARM_TRUSTED_PROXIES (docker-compose.yml)
# so the backend trusts X-Forwarded-For.

events {
    worker_connections 1024;
}

http {
    upstream fluxswarm {
        server fluxswarm:8787;
    }

    # Redirect all HTTP -> HTTPS (HSTS-friendly).
    server {
        listen 80;
        server_name app.fluxswarm.ai;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name app.fluxswarm.ai;

        ssl_certificate     /etc/letsencrypt/live/app.fluxswarm.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.fluxswarm.ai/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # The backend reads the real client IP from this; backend trusts this
        # proxy via FLUXSWARM_TRUSTED_PROXIES=127.0.0.1,::1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 1M;

        location / {
            proxy_pass http://fluxswarm;
            proxy_http_version 1.1;
            # WebSocket support.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
